worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    map $upstream_http_x_request_id $correlation_id {
        default $upstream_http_x_request_id;
        "" $request_id;
    }
    log_format bounded escape=json
        '{"request_id":"$correlation_id","method":"$request_method",'
        '"status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout bounded;

    map "$request_method:$uri" $login_key {
        default "";
        ~^POST:/auth/(login|register)/?$ $binary_remote_addr;
    }
    map "$request_method:$uri" $write_key {
        default "";
        ~^(POST|DELETE):/(sessions|participations|matching)(/|$) $binary_remote_addr;
    }
    map "$request_method:$uri" $read_key {
        default "";
        ~^GET:/(venues|sessions)/?$ $binary_remote_addr;
    }
    limit_req_zone $login_key zone=login:10m rate=10r/m;
    limit_req_zone $write_key zone=writes:10m rate=10r/s;
    limit_req_zone $read_key zone=reads:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream matchmate { server api:8000; keepalive 16; }

    server {
        listen 80;
        server_name localhost;
        return 308 https://localhost:8443$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64k;
        client_header_timeout 10s;
        client_body_timeout 10s;
        send_timeout 30s;
        add_header X-Request-ID $correlation_id always;
        error_page 429 = @rate_limited;
        error_page 413 = @body_too_large;

        location / {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=writes burst=20 nodelay;
            limit_req zone=reads burst=40 nodelay;
            proxy_pass http://matchmate;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-ID "";
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Request-ID "";
            proxy_hide_header X-Request-ID;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
        }

        location @rate_limited {
            default_type application/json;
            add_header X-Request-ID $correlation_id always;
            add_header Retry-After 6 always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Quá nhiều yêu cầu","details":{},"request_id":"$correlation_id"}}';
        }
        location @body_too_large {
            default_type application/json;
            add_header X-Request-ID $correlation_id always;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Nội dung yêu cầu quá lớn","details":{},"request_id":"$correlation_id"}}';
        }
    }
}
