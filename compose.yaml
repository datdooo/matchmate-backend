services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/matchmate.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run python -m scripts.init_env first}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
    volumes:
      - matchmate_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  matchmate_data: