services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Reserved for SQLite later. The skeleton creates no DB and runs no seed.
    volumes:
      - matchmate_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  matchmate_data:
